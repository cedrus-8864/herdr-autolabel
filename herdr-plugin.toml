id = "cedrus.autolabel"
name = "Autolabel"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Auto-name agent panes and tabs after each agent's live topic, via configurable format templates."
platforms = ["macos", "linux"]

# Manual trigger, e.g. `herdr plugin action invoke cedrus.autolabel.sync`
[[actions]]
id = "sync"
title = "Sync pane + tab topics"
contexts = ["workspace", "tab", "pane"]
command = ["bun", "sync-labels.js"]

# Re-sync on anything that could change a pane's topic, its agent, or the layout.
# NOTE: deliberately NOT subscribing to *.renamed — our own renames must not re-trigger us.
[[events]]
on = "workspace.focused"
command = ["bun", "sync-labels.js"]

[[events]]
on = "tab.focused"
command = ["bun", "sync-labels.js"]

[[events]]
on = "pane.focused"
command = ["bun", "sync-labels.js"]

[[events]]
on = "pane.created"
command = ["bun", "sync-labels.js"]

[[events]]
on = "pane.closed"
command = ["bun", "sync-labels.js"]

# Fires when a pane's info changes — including the terminal title (topic) an
# agent sets *without* flipping idle<->working. Without this, a fresh topic
# isn't picked up until the next unrelated event.
[[events]]
on = "pane.updated"
command = ["bun", "sync-labels.js"]

# Fires when a pane's process exits — i.e. an agent session ends and the pane
# drops back to a shell. Lets us restore the tab's pre-agent label.
[[events]]
on = "pane.exited"
command = ["bun", "sync-labels.js"]

[[events]]
on = "pane.moved"
command = ["bun", "sync-labels.js"]

# Tab reorders shift the {n} of every following tab; no loop risk (we never move tabs).
[[events]]
on = "tab.moved"
command = ["bun", "sync-labels.js"]

[[events]]
on = "pane.agent_detected"
command = ["bun", "sync-labels.js"]

# The important one: fires when an agent flips idle<->working, which is when
# Claude sets a fresh topic for the task it just started.
[[events]]
on = "pane.agent_status_changed"
command = ["bun", "sync-labels.js"]
